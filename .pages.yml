# Configuration du back-office Pages CMS (https://pagescms.org)
# Chaque entrée correspond à un fichier de src/content, lu par le site.

media:
  input: public/images
  output: /images
  rename: safe
  categories: [image]

components:
  seo:
    label: Référencement (Google)
    type: object
    fields:
      - { name: title, label: Titre de la page dans Google, type: string, required: true }
      - { name: description, label: Description dans Google, type: text, required: true }
  cta:
    label: Bloc contact en bas de page
    type: object
    fields:
      - { name: title, label: Titre, type: string }
      - { name: text, label: Texte, type: text }
  items:
    label: Éléments
    type: object
    list: true
    fields:
      - { name: title, label: Titre, type: string }
      - { name: text, label: Texte, type: text }

content:
  - name: accueil
    label: Accueil
    type: file
    path: src/content/pages/accueil.json
    format: json
    fields:
      - { name: seo, component: seo }
      - name: hero
        label: Haut de page
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre principal, type: text, description: "Un retour à la ligne = un retour à la ligne à l'écran. *mot* = en italique rouge." }
          - { name: titleSeoPrefix, label: "Début du titre lu par Google (invisible à l'écran)", type: string, readonly: true, description: "Verrouillé par sécurité : modification réservée à l'administrateur du site." }
          - { name: intro, label: Introduction, type: text }
          - { name: image, label: Grande photo, type: image }
          - { name: imageAlt, label: Description de la photo, type: string }
      - name: approche
        label: Notre approche
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string, description: "*mot* = italique" }
          - { name: lead, label: Paragraphe principal, type: text, description: "**gras**, *italique*" }
          - { name: text, label: Second paragraphe, type: text }
      - name: expertises
        label: Savoir-faire (6 cartes)
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - name: items
            label: Cartes
            type: object
            list: true
            fields:
              - { name: label, label: Titre, type: string }
              - { name: text, label: Texte, type: string }
              - { name: image, label: Photo, type: image }
              - { name: imageAlt, label: Description de la photo, type: string }
              - { name: link, label: Lien de la carte, type: string, readonly: true, description: "Verrouillé par sécurité : modification réservée à l'administrateur du site." }
      - name: renovationGlobale
        label: Rénovation globale (bloc sombre)
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: text }
          - { name: text, label: Texte, type: text, description: "**gras**, *italique*" }
          - { name: steps, label: Étapes numérotées, type: string, list: true }
          - { name: linkLabel, label: Texte du lien, type: string }
          - { name: image, label: Photo, type: image }
          - { name: imageAlt, label: Description de la photo, type: string }
      - name: realisations
        label: Réalisations (titres)
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: linkLabel, label: Texte du lien, type: string }
      - name: histoire
        label: L'entreprise (résumé)
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: lead, label: Paragraphe principal, type: text }
          - { name: text, label: Second paragraphe, type: text, description: "**gras**, *italique*" }
          - { name: linkLabel, label: Texte du lien, type: string }
      - name: engagements
        label: Engagements
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: items, component: items }
      - name: avis
        label: Avis clients (titres)
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: note, label: Mention à droite, type: string }
      - name: zones
        label: Zones d'intervention (résumé)
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: lead, label: Texte, type: text }
          - { name: linkLabel, label: Texte du lien, type: string }
      - { name: cta, component: cta }

  - name: savoir-faire
    label: Savoir-faire
    type: group
    items:
      - name: peinture-decoration
        label: Peinture & décoration
        type: file
        path: src/content/pages/peinture-decoration.json
        format: json
        fields: &service
          - { name: seo, component: seo }
          - name: hero
            label: Haut de page
            type: object
            fields:
              - { name: eyebrow, label: Surtitre, type: string }
              - { name: title, label: Titre principal, type: string }
              - { name: titleSeoPrefix, label: "Début du titre lu par Google (invisible à l'écran)", type: string, readonly: true, description: "Verrouillé par sécurité : modification réservée à l'administrateur du site." }
              - { name: intro, label: Introduction, type: text }
              - { name: image, label: Photo, type: image }
              - { name: imageAlt, label: Description de la photo (pour Google et l'accessibilité), type: string }
          - name: chantier
            label: « Sur le chantier » (3 points sous l'introduction)
            type: object
            list: true
            fields:
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: text, description: "**gras**, *italique*" }
          - name: principe
            label: Bloc sombre « Le principe » (facultatif)
            type: object
            fields:
              - { name: eyebrow, label: Surtitre, type: string }
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: text }
          - name: prestations
            label: Prestations
            type: object
            fields:
              - { name: eyebrow, label: Surtitre, type: string }
              - { name: title, label: Titre, type: string }
              - { name: items, component: items }
          - name: methode
            label: Bloc « Méthode »
            type: object
            fields:
              - { name: eyebrow, label: Surtitre, type: string }
              - { name: title, label: Titre, type: string }
              - { name: lead, label: Paragraphe principal, type: text, description: "**gras**, *italique*" }
              - { name: text, label: Second paragraphe, type: text, description: "**gras**, *italique*" }
          - { name: cta, component: cta }
      - { name: sols-parquets, label: Sols & parquets, type: file, path: src/content/pages/sols-parquets.json, format: json, fields: *service }
      - { name: murs-revetements, label: Murs & revêtements, type: file, path: src/content/pages/murs-revetements.json, format: json, fields: *service }
      - { name: renovation-interieure, label: Rénovation intérieure, type: file, path: src/content/pages/renovation-interieure.json, format: json, fields: *service }
      - { name: facades-exterieur, label: Façades & extérieur, type: file, path: src/content/pages/facades-exterieur.json, format: json, fields: *service }
      - { name: entretien-bati, label: Entretien & bâti, type: file, path: src/content/pages/entretien-bati.json, format: json, fields: *service }

  - name: realisations
    label: Réalisations (fiches)
    type: collection
    path: src/content/realisations
    format: json
    filename: "{primary}.json"
    operations: { rename: false }
    view:
      primary: title
      fields: [title, city, type]
      sort: [order]
    fields:
      - { name: order, label: Ordre d'affichage, type: number }
      - { name: slug, label: Adresse de la page, type: string, readonly: true, description: "Créée automatiquement à partir du titre lors de l'ajout. Verrouillée par sécurité : la modifier casserait les liens et le référencement." }
      - { name: title, label: Titre, type: string, required: true }
      - { name: city, label: Commune, type: string }
      - { name: type, label: Type de travaux, type: string }
      - { name: year, label: Année, type: string }
      - { name: seoTitle, label: Titre dans Google, type: string }
      - { name: summary, label: Résumé (aussi utilisé par Google), type: text }
      - { name: description, label: Description, type: text }
      - { name: prestations, label: Prestations réalisées, type: string, list: true }
      - name: images
        label: Photos (la première sert de vignette)
        type: object
        list: true
        fields:
          - { name: src, label: Photo, type: image }
          - { name: alt, label: Description de la photo, type: string }
      - name: beforeAfter
        label: Avant / après (curseur)
        type: object
        list: true
        fields:
          - { name: beforeImage, label: Photo avant, type: image }
          - { name: afterImage, label: Photo après, type: image }
          - { name: beforeAlt, label: Description photo avant, type: string }
          - { name: afterAlt, label: Description photo après, type: string }

  - name: villes
    label: Pages villes
    type: collection
    path: src/content/villes
    format: json
    filename: "{primary}.json"
    operations: { rename: false, delete: false }
    view:
      primary: name
      fields: [name, h1]
      sort: [order]
    fields:
      - { name: order, label: Ordre d'affichage, type: number }
      - { name: main, label: Siège de l'entreprise, type: boolean, readonly: true, description: "Verrouillé par sécurité : modification réservée à l'administrateur du site." }
      - { name: slug, label: Adresse de la page, type: string, readonly: true, description: "Créée automatiquement à partir du nom de la commune lors de l'ajout. Verrouillée par sécurité : la modifier casserait les liens et le référencement." }
      - { name: name, label: Nom de la commune, type: string, required: true }
      - { name: seoTitle, label: Titre dans Google, type: string }
      - { name: description, label: Description dans Google, type: text }
      - { name: eyebrow, label: Surtitre, type: string }
      - { name: h1, label: Titre principal, type: string }
      - { name: intro, label: Introduction, type: text }
      - { name: hubText, label: Texte court (page Zones d'intervention), type: text }
      - { name: localTitle, label: Titre du bloc local, type: string }
      - { name: localParagraphs, label: Paragraphes du bloc local, type: text, list: true }
      - { name: projects, component: items, label: Projets types }
      - { name: expertisesTitle, label: Titre des savoir-faire, type: string }
      - name: expertises
        label: Savoir-faire mis en avant
        type: object
        list: true
        fields:
          - name: key
            label: Savoir-faire
            type: select
            options:
              values:
                - { value: peinture, label: Peinture & décoration }
                - { value: sols, label: Sols & parquets }
                - { value: murs, label: Murs & revêtements }
                - { value: renovation, label: Rénovation intérieure }
                - { value: facades, label: Façades & extérieur }
                - { value: entretien, label: Entretien & bâti }
          - { name: text, label: Texte, type: text }
      - { name: showcaseTitle, label: Titre du bloc photos, type: string }
      - { name: showcaseText, label: Texte du bloc photos, type: text }
      - { name: neighbours, label: Communes voisines (liens), type: string, list: true, readonly: true, description: "Verrouillé par sécurité : modification réservée à l'administrateur du site." }

  - name: entreprise
    label: L'entreprise
    type: file
    path: src/content/pages/entreprise.json
    format: json
    fields:
      - { name: seo, component: seo }
      - name: hero
        label: Haut de page
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre principal, type: string }
          - { name: titleSeoPrefix, label: "Début du titre lu par Google (invisible à l'écran)", type: string, readonly: true, description: "Verrouillé par sécurité : modification réservée à l'administrateur du site." }
          - { name: intro, label: Introduction, type: text }
          - { name: image, label: Photo, type: image }
          - { name: imageAlt, label: Description de la photo, type: string }
      - name: famille
        label: La famille
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: lead, label: Paragraphe principal, type: text }
          - { name: text, label: Second paragraphe, type: text }
      - name: engagements
        label: Engagements
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: items, component: items }
      - name: methode
        label: Déroulé d'un chantier
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - name: steps
            label: Étapes
            type: object
            list: true
            fields:
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: string }
      - { name: cta, component: cta }

  - name: zones-intervention
    label: Zones d'intervention (page générale)
    type: file
    path: src/content/pages/zones-intervention.json
    format: json
    fields:
      - { name: seo, component: seo }
      - name: hero
        label: Haut de page
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
      - name: communes
        label: Liste des communes (titres)
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
      - name: auDela
        label: Bloc « Votre commune n'est pas listée »
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: text, label: Texte, type: text }
      - { name: cta, component: cta }

  - name: contact
    label: Contact
    type: file
    path: src/content/pages/contact.json
    format: json
    fields:
      - { name: seo, component: seo }
      - name: hero
        label: Haut de page
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
      - { name: horairesNote, label: Note sous les horaires, type: text }
      - { name: bonASavoir, label: « Bon à savoir », type: string, list: true }

  - name: reglages
    label: Réglages
    type: group
    items:
      - name: general
        label: Coordonnées et horaires
        type: file
        path: src/content/general.json
        format: json
        fields:
          - { name: name, label: Nom de l'entreprise, type: string, readonly: true, description: "Verrouillé par sécurité : modification réservée à l'administrateur du site." }
          - { name: baseline, label: Activité, type: string }
          - { name: city, label: Ville du siège, type: string }
          - { name: since, label: Année de création, type: number }
          - { name: phone, label: Téléphone, type: string }
          - { name: email, label: Email, type: string }
          - { name: address, label: Adresse, type: string }
          - name: hours
            label: Horaires
            type: object
            fields:
              - { name: days, label: Jours, type: string }
              - { name: range, label: Horaires affichés, type: string }
              - { name: openHour, label: "Heure d'ouverture (badge « Ouvert »)", type: number }
              - { name: closeHour, label: "Heure de fermeture (badge « Ouvert »)", type: number }
          - { name: footerText, label: Texte du pied de page, type: text }
      - name: avis
        label: Avis clients
        type: file
        path: src/content/avis.json
        format: json
        fields:
          - name: avis
            label: Avis
            type: object
            list: true
            fields:
              - { name: author, label: Nom, type: string }
              - { name: rating, label: Note sur 5, type: number }
              - { name: date, label: "Date (ex. il y a 3 mois)", type: string }
              - { name: text, label: Avis, type: text }
      - name: technique
        label: Paramètres techniques
        type: file
        path: src/content/technique.json
        format: json
        fields:
          - { name: siteUrl, label: Domaine du site, type: string, readonly: true, description: "Verrouillé par sécurité : un changement de domaine se prépare avec l'administrateur (redirections, Google Search Console)." }
          - { name: backOffice, label: Accès au back-office, type: string, readonly: true, description: "Verrouillé par sécurité : modification réservée à l'administrateur du site." }
          - { name: hebergement, label: Hébergement, type: string, readonly: true, description: "Verrouillé par sécurité : modification réservée à l'administrateur du site." }
          - { name: indexation, label: Indexation par les moteurs de recherche, type: string, readonly: true, description: "Verrouillé par sécurité : une erreur ici retirerait le site de Google." }
          - { name: sitemap, label: Plan du site envoyé à Google, type: string, readonly: true, description: "Mis à jour automatiquement à chaque nouvelle page. Verrouillé par sécurité." }
          - { name: donneesStructurees, label: Données structurées (fiche entreprise pour Google), type: string, readonly: true, description: "Générées automatiquement à partir des coordonnées. Verrouillé par sécurité." }
          - { name: cookies, label: Cookies et RGPD, type: string, readonly: true, description: "Verrouillé par sécurité : modification réservée à l'administrateur du site." }
      - name: engagements
        label: Engagements (pages villes)
        type: file
        path: src/content/engagements.json
        format: json
        fields:
          - { name: engagements, component: items, label: Engagements }
